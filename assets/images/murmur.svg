<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <title>Murmur: Captura de audio, transcripción Whisper y notas académicas sincronizadas por MCP</title>
  <rect width="1400" height="560" fill="#0a0d16"/>
  <g stroke="#1b2436" stroke-width="1" opacity="0.55">
    <line x1="50" y1="0" x2="50" y2="560"/><line x1="150" y1="0" x2="150" y2="560"/>
    <line x1="250" y1="0" x2="250" y2="560"/><line x1="350" y1="0" x2="350" y2="560"/>
    <line x1="450" y1="0" x2="450" y2="560"/><line x1="550" y1="0" x2="550" y2="560"/>
    <line x1="650" y1="0" x2="650" y2="560"/><line x1="750" y1="0" x2="750" y2="560"/>
    <line x1="850" y1="0" x2="850" y2="560"/><line x1="950" y1="0" x2="950" y2="560"/>
    <line x1="1050" y1="0" x2="1050" y2="560"/><line x1="1150" y1="0" x2="1150" y2="560"/>
    <line x1="1250" y1="0" x2="1250" y2="560"/><line x1="1350" y1="0" x2="1350" y2="560"/>
    <line x1="0" y1="50" x2="1400" y2="50"/><line x1="0" y1="150" x2="1400" y2="150"/>
    <line x1="0" y1="250" x2="1400" y2="250"/><line x1="0" y1="350" x2="1400" y2="350"/>
    <line x1="0" y1="450" x2="1400" y2="450"/><line x1="0" y1="550" x2="1400" y2="550"/>
  </g>

  <!-- Nodo izquierdo: Captura de voz y espectrograma Whisper -->
  <rect x="90" y="130" width="260" height="300" rx="12" fill="#0d1220" stroke="#818cf8" stroke-width="2.5"/>
  <circle cx="150" cy="180" r="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <path d="M144 175 C144 171, 156 171, 156 175 L156 182 C156 186, 144 186, 144 182 Z" fill="#818cf8"/>
  <path d="M140 180 C140 190, 160 190, 160 180" fill="none" stroke="#818cf8" stroke-width="2"/>
  <line x1="150" y1="190" x2="150" y2="197" stroke="#818cf8" stroke-width="2"/>
  <rect x="180" y="174" width="130" height="12" rx="4" fill="#a5b4fc" opacity="0.8"/>

  <!-- Barras de forma de onda Whisper -->
  <g fill="#818cf8" opacity="0.9">
    <rect x="120" y="230" width="6" height="40" rx="3"/>
    <rect x="134" y="215" width="6" height="70" rx="3"/>
    <rect x="148" y="200" width="6" height="100" rx="3"/>
    <rect x="162" y="220" width="6" height="60" rx="3"/>
    <rect x="176" y="205" width="6" height="90" rx="3"/>
    <rect x="190" y="235" width="6" height="30" rx="3"/>
    <rect x="204" y="210" width="6" height="80" rx="3"/>
    <rect x="218" y="225" width="6" height="50" rx="3"/>
    <rect x="232" y="195" width="6" height="110" rx="3"/>
    <rect x="246" y="220" width="6" height="60" rx="3"/>
    <rect x="260" y="235" width="6" height="30" rx="3"/>
    <rect x="274" y="215" width="6" height="70" rx="3"/>
    <rect x="288" y="228" width="6" height="44" rx="3"/>
    <rect x="302" y="238" width="6" height="24" rx="3"/>
  </g>
  <rect x="120" y="360" width="200" height="10" rx="4" fill="#6366f1" opacity="0.5"/>
  <rect x="120" y="380" width="140" height="8" rx="4" fill="#4338ca" opacity="0.7"/>

  <!-- Enlace hacia motor LLM -->
  <path d="M350 280 C440 280, 440 280, 520 280" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Nodo central: Síntesis de notas Cornell con LLM -->
  <rect x="520" y="110" width="360" height="340" rx="12" fill="#0d1220" stroke="#c084fc" stroke-width="2.5"/>
  <rect x="546" y="140" width="140" height="12" rx="4" fill="#c084fc" opacity="0.9"/>
  <rect x="546" y="165" width="220" height="8" rx="4" fill="#e9d5ff" opacity="0.4"/>

  <!-- Panel Cornell: Columna de conceptos y columna de notas -->
  <line x1="640" y1="195" x2="640" y2="380" stroke="#3b0764" stroke-width="2"/>
  <g fill="#c084fc" opacity="0.8">
    <rect x="546" y="205" width="80" height="9" rx="3"/>
    <rect x="546" y="245" width="70" height="9" rx="3"/>
    <rect x="546" y="285" width="85" height="9" rx="3"/>
    <rect x="546" y="325" width="65" height="9" rx="3"/>
  </g>
  <g fill="#38bdf8" opacity="0.6">
    <rect x="656" y="205" width="190" height="8" rx="3"/>
    <rect x="656" y="222" width="150" height="8" rx="3"/>
    <rect x="656" y="245" width="180" height="8" rx="3"/>
    <rect x="656" y="262" width="130" height="8" rx="3"/>
    <rect x="656" y="285" width="200" height="8" rx="3"/>
    <rect x="656" y="302" width="160" height="8" rx="3"/>
  </g>
  <line x1="546" y1="390" x2="850" y2="390" stroke="#3b0764" stroke-width="2"/>
  <rect x="546" y="405" width="280" height="8" rx="3" fill="#f43f5e" opacity="0.7"/>

  <!-- Enlace MCP hacia destinos -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none">
    <path d="M880 280 C980 280, 980 170, 1060 170"/>
    <path d="M880 280 L 1060 280"/>
    <path d="M880 280 C980 280, 980 390, 1060 390"/>
  </g>

  <!-- Conectores MCP: Obsidian, LaTeX y Notion -->
  <g fill="#0d1220" stroke="#38bdf8" stroke-width="2.5">
    <rect x="1060" y="125" width="250" height="86" rx="8"/>
    <rect x="1060" y="237" width="250" height="86" rx="8"/>
    <rect x="1060" y="347" width="250" height="86" rx="8"/>
  </g>
  <g fill="#38bdf8">
    <polygon points="1090,158 1105,178 1075,178" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="1120" y="156" width="130" height="10" rx="3" opacity="0.8"/>
    <rect x="1120" y="174" width="90" height="8" rx="3" opacity="0.4"/>

    <text x="1080" y="290" font-family="monospace" font-size="22" font-weight="bold" fill="#38bdf8">TeX</text>
    <rect x="1135" y="268" width="120" height="10" rx="3" opacity="0.8"/>
    <rect x="1135" y="286" width="150" height="8" rx="3" opacity="0.4"/>

    <rect x="1080" y="375" width="20" height="26" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <rect x="1115" y="378" width="140" height="10" rx="3" opacity="0.8"/>
    <rect x="1115" y="396" width="100" height="8" rx="3" opacity="0.4"/>
  </g>
</svg>
