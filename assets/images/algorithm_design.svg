<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <title>Un problema resuelto de cuatro maneras: dividir, escoger, explorar y tabular</title>
  <rect width="1400" height="560" fill="#0a0d16"/>
  <g stroke="#1b2436" stroke-width="1" opacity="0.45">
    <line x1="350" y1="0" x2="350" y2="560"/><line x1="700" y1="0" x2="700" y2="560"/>
    <line x1="1050" y1="0" x2="1050" y2="560"/>
    <line x1="0" y1="140" x2="1400" y2="140"/><line x1="0" y1="420" x2="1400" y2="420"/>
  </g>

  <!-- 1. Divide y venceras: el arbol que se parte por la mitad -->
  <g stroke="#2bf0a8" stroke-width="2.5" fill="none">
    <line x1="175" y1="150" x2="105" y2="230"/><line x1="175" y1="150" x2="245" y2="230"/>
    <line x1="105" y1="230" x2="70" y2="310"/><line x1="105" y1="230" x2="140" y2="310"/>
    <line x1="245" y1="230" x2="210" y2="310"/><line x1="245" y1="230" x2="280" y2="310"/>
  </g>
  <g fill="#2bf0a8">
    <circle cx="175" cy="150" r="13"/>
    <circle cx="105" cy="230" r="11"/><circle cx="245" cy="230" r="11"/>
  </g>
  <g fill="#0d1220" stroke="#2bf0a8" stroke-width="2.5">
    <circle cx="70" cy="310" r="9"/><circle cx="140" cy="310" r="9"/>
    <circle cx="210" cy="310" r="9"/><circle cx="280" cy="310" r="9"/>
  </g>

  <!-- 2. Greedy: la barra mas alta de cada paso, tomada sin mirar atras -->
  <g>
    <rect x="410" y="250" width="34" height="60" fill="#243044"/>
    <rect x="454" y="200" width="34" height="110" fill="#b8ff3c"/>
    <rect x="498" y="270" width="34" height="40" fill="#243044"/>
    <rect x="542" y="180" width="34" height="130" fill="#b8ff3c"/>
    <rect x="586" y="240" width="34" height="70" fill="#243044"/>
    <path d="M471 175 l 0 -22 M559 155 l 0 -22" stroke="#b8ff3c" stroke-width="3" stroke-linecap="round"/>
    <path d="M462 162 l 9 -12 l 9 12 M550 142 l 9 -12 l 9 12" fill="none" stroke="#b8ff3c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3. Backtracking: el camino que entra, choca y vuelve -->
  <g fill="none" stroke-width="2.5">
    <path d="M760 300 L820 300 L820 230 L880 230 L880 300 L940 300" stroke="#36d3f7"/>
    <path d="M820 300 L820 360 L880 360" stroke="#36d3f7" stroke-dasharray="7 7" opacity="0.55"/>
  </g>
  <g fill="#36d3f7">
    <circle cx="760" cy="300" r="8"/><circle cx="940" cy="300" r="8"/>
  </g>
  <g stroke="#ff6b6b" stroke-width="3" stroke-linecap="round">
    <path d="M872 352 l 16 16 M888 352 l -16 16"/>
  </g>

  <!-- 4. Programacion dinamica: la tabla que se rellena y se lee al reves -->
  <g stroke="#243044" stroke-width="2" fill="#0d1220">
    <rect x="1110" y="180" width="52" height="42"/><rect x="1162" y="180" width="52" height="42"/>
    <rect x="1214" y="180" width="52" height="42"/><rect x="1266" y="180" width="52" height="42"/>
    <rect x="1110" y="222" width="52" height="42"/><rect x="1162" y="222" width="52" height="42"/>
    <rect x="1214" y="222" width="52" height="42"/><rect x="1266" y="222" width="52" height="42"/>
    <rect x="1110" y="264" width="52" height="42"/><rect x="1162" y="264" width="52" height="42"/>
    <rect x="1214" y="264" width="52" height="42"/><rect x="1266" y="264" width="52" height="42"/>
  </g>
  <g fill="#2bf0a8" fill-opacity="0.75" stroke="#2bf0a8" stroke-width="2">
    <rect x="1110" y="180" width="52" height="42"/>
    <rect x="1162" y="222" width="52" height="42"/>
    <rect x="1214" y="222" width="52" height="42"/>
    <rect x="1266" y="264" width="52" height="42"/>
  </g>
  <path d="M1292 264 L1240 243 L1188 243 L1136 201" fill="none" stroke="#b8ff3c" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Las cuatro etiquetas, como reglas bajo cada panel -->
  <g fill="#2bf0a8" opacity="0.8">
    <rect x="70" y="470" width="210" height="8" rx="4"/>
  </g>
  <g fill="#b8ff3c" opacity="0.8">
    <rect x="410" y="470" width="210" height="8" rx="4"/>
  </g>
  <g fill="#36d3f7" opacity="0.8">
    <rect x="760" y="470" width="180" height="8" rx="4"/>
  </g>
  <g fill="#2bf0a8" opacity="0.8">
    <rect x="1110" y="470" width="208" height="8" rx="4"/>
  </g>
</svg>
