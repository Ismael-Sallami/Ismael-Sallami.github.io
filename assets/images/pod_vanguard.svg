<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <title>PodVanguard: Centro de mando web de alto rendimiento para contenedores y pods en Linux</title>
  <rect width="1400" height="560" fill="#0a0d16"/>
  <g stroke="#1b2436" stroke-width="1" opacity="0.55">
    <line x1="50" y1="0" x2="50" y2="560"/><line x1="150" y1="0" x2="150" y2="560"/>
    <line x1="250" y1="0" x2="250" y2="560"/><line x1="350" y1="0" x2="350" y2="560"/>
    <line x1="450" y1="0" x2="450" y2="560"/><line x1="550" y1="0" x2="550" y2="560"/>
    <line x1="650" y1="0" x2="650" y2="560"/><line x1="750" y1="0" x2="750" y2="560"/>
    <line x1="850" y1="0" x2="850" y2="560"/><line x1="950" y1="0" x2="950" y2="560"/>
    <line x1="1050" y1="0" x2="1050" y2="560"/><line x1="1150" y1="0" x2="1150" y2="560"/>
    <line x1="1250" y1="0" x2="1250" y2="560"/><line x1="1350" y1="0" x2="1350" y2="560"/>
    <line x1="0" y1="50" x2="1400" y2="50"/><line x1="0" y1="150" x2="1400" y2="150"/>
    <line x1="0" y1="250" x2="1400" y2="250"/><line x1="0" y1="350" x2="1400" y2="350"/>
    <line x1="0" y1="450" x2="1400" y2="450"/><line x1="0" y1="550" x2="1400" y2="550"/>
  </g>

  <!-- Panel Izquierdo: Topología de Pods y Contenedores OCI -->
  <rect x="85" y="85" width="600" height="390" rx="12" fill="#0d1220" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="85" y="85" width="600" height="44" rx="12" fill="#101d30"/>
  <circle cx="115" cy="107" r="5.5" fill="#38bdf8"/>
  <text x="135" y="112" font-family="monospace" font-size="15" font-weight="bold" fill="#7dd3fc">POD VANGUARD · LINUX CONTAINER ORCHESTRATOR</text>

  <!-- Tarjeta Pod 1 (Ingress + API) -->
  <rect x="115" y="155" width="255" height="135" rx="10" fill="#111a2e" stroke="#10b981" stroke-width="2"/>
  <circle cx="138" cy="180" r="5" fill="#10b981"/>
  <text x="152" y="185" font-family="monospace" font-size="14" font-weight="bold" fill="#34d399">pod/core-gateway</text>
  <rect x="132" y="202" width="220" height="28" rx="5" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <text x="144" y="221" font-family="monospace" font-size="12" fill="#94a3b8">envoy-proxy:1.31  [RUNNING]</text>
  <rect x="132" y="240" width="220" height="28" rx="5" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <text x="144" y="259" font-family="monospace" font-size="12" fill="#94a3b8">auth-guard:v2.4   [RUNNING]</text>

  <!-- Tarjeta Pod 2 (Worker Mesh) -->
  <rect x="395" y="155" width="260" height="135" rx="10" fill="#111a2e" stroke="#818cf8" stroke-width="2"/>
  <circle cx="418" cy="180" r="5" fill="#818cf8"/>
  <text x="432" y="185" font-family="monospace" font-size="14" font-weight="bold" fill="#a5b4fc">pod/compute-engine</text>
  <rect x="412" y="202" width="225" height="28" rx="5" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <text x="424" y="221" font-family="monospace" font-size="12" fill="#94a3b8">worker-node-01    [HEALTHY]</text>
  <rect x="412" y="240" width="225" height="28" rx="5" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <text x="424" y="259" font-family="monospace" font-size="12" fill="#94a3b8">redis-cache:7.4   [HEALTHY]</text>

  <!-- Bus de red virtual CNI / Podman Bridge -->
  <line x1="242" y1="290" x2="242" y2="335" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="525" y1="290" x2="525" y2="335" stroke="#818cf8" stroke-width="2.5"/>
  <rect x="115" y="335" width="540" height="110" rx="10" fill="#090d16" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="138" y="365" font-family="monospace" font-size="13.5" font-weight="bold" fill="#38bdf8">CNI BRIDGE · cgroups v2 · Namespace Isolation</text>
  <g fill="#10b981" opacity="0.85">
    <rect x="138" y="382" width="110" height="10" rx="3"/>
    <rect x="260" y="382" width="145" height="10" rx="3" fill="#38bdf8"/>
    <rect x="418" y="382" width="95" height="10" rx="3" fill="#a855f7"/>
    <rect x="525" y="382" width="105" height="10" rx="3" fill="#f59e0b"/>
  </g>
  <text x="138" y="422" font-family="monospace" font-size="12" fill="#64748b">NET I/O: 1.48 GB/s  ·  PIDS: 64  ·  ROOTLESS: ENABLED</text>

  <!-- Panel Derecho: Telemetría en Tiempo Real e Inspector de Logs -->
  <rect x="730" y="85" width="585" height="390" rx="12" fill="#0d1220" stroke="#a855f7" stroke-width="2.5"/>
  <rect x="730" y="85" width="585" height="44" rx="12" fill="#1e132d"/>
  <circle cx="760" cy="107" r="5.5" fill="#c084fc"/>
  <text x="780" y="112" font-family="monospace" font-size="15" font-weight="bold" fill="#d8b4fe">LIVE TELEMETRY · CPU / MEMORY / STREAM LOGS</text>

  <!-- Curva de carga de CPU y Memoria -->
  <rect x="760" y="152" width="525" height="135" rx="8" fill="#080b12" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M775 255 L825 230 L875 242 L925 195 L975 210 L1025 175 L1075 190 L1125 168 L1175 182 L1225 160 L1270 172" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M775 268 L825 260 L875 258 L925 240 L975 245 L1025 225 L1075 232 L1125 218 L1175 222 L1225 210 L1270 215" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="780" y="176" font-family="monospace" font-size="12.5" fill="#38bdf8">CPU: 18.4% (cgroups quota)</text>
  <text x="1030" y="176" font-family="monospace" font-size="12.5" fill="#10b981">MEM: 642 MB / 4.0 GB</text>

  <!-- Stream de logs en vivo -->
  <rect x="760" y="308" width="525" height="142" rx="8" fill="#070a10" stroke="#1e293b" stroke-width="1.5"/>
  <g font-family="monospace" font-size="12.5">
    <text x="780" y="336" fill="#10b981">[11:42:01] INFO  pod/core-gateway: healthcheck 200 OK (1.2ms)</text>
    <text x="780" y="362" fill="#38bdf8">[11:42:02] SYNC  container/envoy-proxy: config hot-reloaded</text>
    <text x="780" y="388" fill="#c084fc">[11:42:04] SCALE pod/compute-engine: replicas=4 ready=4/4</text>
    <text x="780" y="414" fill="#fbbf24">[11:42:05] AUDIT seccomp profile verified · zero capabilities leaked</text>
  </g>
</svg>
