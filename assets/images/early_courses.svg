<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <title>Tres cursos apilados con sus certificados y el progreso completado</title>
  <rect width="1400" height="560" fill="#0a0d16"/>
  <g stroke="#1b2436" stroke-width="1" opacity="0.5">
    <line x1="100" y1="0" x2="100" y2="560"/><line x1="250" y1="0" x2="250" y2="560"/>
    <line x1="400" y1="0" x2="400" y2="560"/><line x1="550" y1="0" x2="550" y2="560"/>
    <line x1="700" y1="0" x2="700" y2="560"/><line x1="850" y1="0" x2="850" y2="560"/>
    <line x1="1000" y1="0" x2="1000" y2="560"/><line x1="1150" y1="0" x2="1150" y2="560"/>
    <line x1="1300" y1="0" x2="1300" y2="560"/>
    <line x1="0" y1="140" x2="1400" y2="140"/><line x1="0" y1="280" x2="1400" y2="280"/>
    <line x1="0" y1="420" x2="1400" y2="420"/>
  </g>

  <!-- Tres cursos, uno por fila -->
  <g stroke-width="2.5" fill="#0d1220">
    <rect x="110" y="110" width="700" height="100" rx="10" stroke="#2bf0a8"/>
    <rect x="110" y="230" width="700" height="100" rx="10" stroke="#2bf0a8"/>
    <rect x="110" y="350" width="700" height="100" rx="10" stroke="#2bf0a8"/>
  </g>
  <g fill="#2bf0a8" opacity="0.85">
    <rect x="146" y="140" width="210" height="11" rx="5"/>
    <rect x="146" y="260" width="164" height="11" rx="5"/>
    <rect x="146" y="380" width="238" height="11" rx="5"/>
  </g>
  <g fill="#36d3f7" opacity="0.4">
    <rect x="146" y="168" width="330" height="9" rx="4"/>
    <rect x="146" y="288" width="286" height="9" rx="4"/>
    <rect x="146" y="408" width="352" height="9" rx="4"/>
  </g>

  <!-- Barras de progreso al 100 -->
  <g>
    <rect x="540" y="150" width="230" height="12" rx="6" fill="#243044"/>
    <rect x="540" y="150" width="230" height="12" rx="6" fill="#2bf0a8"/>
    <rect x="540" y="270" width="230" height="12" rx="6" fill="#243044"/>
    <rect x="540" y="270" width="230" height="12" rx="6" fill="#2bf0a8"/>
    <rect x="540" y="390" width="230" height="12" rx="6" fill="#243044"/>
    <rect x="540" y="390" width="230" height="12" rx="6" fill="#2bf0a8"/>
  </g>

  <!-- El certificado -->
  <rect x="900" y="150" width="400" height="270" rx="12" fill="#0d1220" stroke="#36d3f7" stroke-width="2.5"/>
  <rect x="932" y="182" width="336" height="206" rx="6" fill="none" stroke="#243044" stroke-width="2"/>
  <g fill="#36d3f7" opacity="0.6">
    <rect x="972" y="214" width="256" height="11" rx="5"/>
    <rect x="1012" y="248" width="176" height="9" rx="4"/>
    <rect x="992" y="278" width="216" height="9" rx="4"/>
  </g>
  <circle cx="1100" cy="336" r="30" fill="none" stroke="#b8ff3c" stroke-width="3"/>
  <path d="M1084 336 l 12 13 l 26 -30" fill="none" stroke="#b8ff3c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
