<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <title>GitVanguard: Controlador Git TUI en Rust con Time Machine, Sentinel Secret Shield y Worktrees</title>
  <rect width="1400" height="560" fill="#0a0d16"/>
  <g stroke="#1b2436" stroke-width="1" opacity="0.55">
    <line x1="50" y1="0" x2="50" y2="560"/><line x1="150" y1="0" x2="150" y2="560"/>
    <line x1="250" y1="0" x2="250" y2="560"/><line x1="350" y1="0" x2="350" y2="560"/>
    <line x1="450" y1="0" x2="450" y2="560"/><line x1="550" y1="0" x2="550" y2="560"/>
    <line x1="650" y1="0" x2="650" y2="560"/><line x1="750" y1="0" x2="750" y2="560"/>
    <line x1="850" y1="0" x2="850" y2="560"/><line x1="950" y1="0" x2="950" y2="560"/>
    <line x1="1050" y1="0" x2="1050" y2="560"/><line x1="1150" y1="0" x2="1150" y2="560"/>
    <line x1="1250" y1="0" x2="1250" y2="560"/><line x1="1350" y1="0" x2="1350" y2="560"/>
    <line x1="0" y1="50" x2="1400" y2="50"/><line x1="0" y1="150" x2="1400" y2="150"/>
    <line x1="0" y1="250" x2="1400" y2="250"/><line x1="0" y1="350" x2="1400" y2="350"/>
    <line x1="0" y1="450" x2="1400" y2="450"/><line x1="0" y1="550" x2="1400" y2="550"/>
  </g>

  <!-- Ventana TUI Principal en Rust -->
  <rect x="85" y="75" width="1230" height="410" rx="12" fill="#0d1220" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="85" y="75" width="1230" height="42" rx="12" fill="#23190d"/>
  <circle cx="115" cy="96" r="5.5" fill="#f59e0b"/>
  <text x="135" y="101" font-family="monospace" font-size="15" font-weight="bold" fill="#fbbf24">GIT VANGUARD TUI (Rust) · [1] DAG &amp; Worktrees  [2] Time Machine  [3] Sentinel Shield</text>

  <!-- Columna 1: Grafo DAG de Commits + Worktrees paralelos -->
  <rect x="110" y="138" width="440" height="322" rx="8" fill="#080b12" stroke="#334155" stroke-width="1.5"/>
  <text x="130" y="166" font-family="monospace" font-size="13.5" font-weight="bold" fill="#fbbf24">COMMIT DAG &amp; WORKTREES</text>

  <!-- Líneas del grafo Git -->
  <line x1="150" y1="190" x2="150" y2="415" stroke="#10b981" stroke-width="3"/>
  <path d="M150 320 C150 280, 190 280, 190 245 L190 205 C190 190, 150 190, 150 190" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

  <circle cx="150" cy="195" r="7" fill="#10b981"/>
  <circle cx="190" cy="235" r="6.5" fill="#38bdf8"/>
  <circle cx="150" cy="275" r="6.5" fill="#10b981"/>
  <circle cx="150" cy="325" r="6.5" fill="#10b981"/>
  <circle cx="150" cy="375" r="6.5" fill="#f59e0b"/>

  <g font-family="monospace" font-size="13">
    <text x="215" y="200" fill="#34d399">8c84b5a (HEAD -> main) feat: zero-copy parser</text>
    <text x="215" y="240" fill="#7dd3fc">4f91e02 (wt/ feat-tui)perf: async revwalk</text>
    <text x="215" y="280" fill="#e2e8f0">1a7c3d9 fix: worktree lock contention</text>
    <text x="215" y="330" fill="#94a3b8">9b20f41 refactor: sentinel entropy scanner</text>
    <text x="215" y="380" fill="#fbbf24">3e11a08 (tag: v1.4.0) release: linux binary</text>
  </g>

  <!-- Columna 2: Reflog Time Machine & Snapshot Restore -->
  <rect x="570" y="138" width="350" height="322" rx="8" fill="#080b12" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="590" y="166" font-family="monospace" font-size="13.5" font-weight="bold" fill="#38bdf8">TIME MACHINE · REFLOG TIMELINE</text>
  <g font-family="monospace" font-size="12.5">
    <rect x="590" y="185" width="310" height="44" rx="6" fill="#0f1e32" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="605" y="205" fill="#7dd3fc">HEAD@{0} · 2 mins ago</text>
    <text x="605" y="222" fill="#94a3b8">rebase -i (finish): main</text>

    <rect x="590" y="242" width="310" height="44" rx="6" fill="#0d1320" stroke="#1e293b" stroke-width="1.5"/>
    <text x="605" y="262" fill="#e2e8f0">HEAD@{1} · 14 mins ago</text>
    <text x="605" y="279" fill="#64748b">checkout: moving to feat-tui</text>

    <rect x="590" y="299" width="310" height="44" rx="6" fill="#0d1320" stroke="#1e293b" stroke-width="1.5"/>
    <text x="605" y="319" fill="#e2e8f0">HEAD@{2} · 1 hour ago</text>
    <text x="605" y="336" fill="#64748b">reset: moving to 1a7c3d9</text>
  </g>
  <rect x="590" y="365" width="310" height="72" rx="6" fill="#0d231d" stroke="#10b981" stroke-width="1.5"/>
  <text x="606" y="392" font-family="monospace" font-size="13" font-weight="bold" fill="#34d399">INSTANT SNAPSHOT RECOVERY</text>
  <text x="606" y="416" font-family="monospace" font-size="12" fill="#a7f3d0">[Enter] Restore state without data loss</text>

  <!-- Columna 3: Sentinel Secret Shield -->
  <rect x="940" y="138" width="350" height="322" rx="8" fill="#080b12" stroke="#10b981" stroke-width="1.8"/>
  <text x="960" y="166" font-family="monospace" font-size="13.5" font-weight="bold" fill="#34d399">SENTINEL SECRET SHIELD</text>

  <rect x="960" y="188" width="310" height="86" rx="6" fill="#23121b" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="976" y="214" font-family="monospace" font-size="13" font-weight="bold" fill="#fb7185">BLOCKED LEAK IN STAGED DIFF</text>
  <text x="976" y="236" font-family="monospace" font-size="12" fill="#fda4af">AWS_SECRET_KEY (Entropy: 4.82)</text>
  <text x="976" y="256" fill="#94a3b8" font-family="monospace" font-size="11.5">src/config/env.rs:42 [REDACTED]</text>

  <rect x="960" y="292" width="310" height="145" rx="6" fill="#0b1522" stroke="#1e293b" stroke-width="1.5"/>
  <g font-family="monospace" font-size="12.5" fill="#94a3b8">
    <text x="976" y="320" fill="#34d399">✓ SSH Private Keys: 0 found</text>
    <text x="976" y="346" fill="#34d399">✓ Bearer / API Tokens: 0 found</text>
    <text x="976" y="372" fill="#34d399">✓ .env / Credentials: Ignored</text>
    <text x="976" y="408" fill="#fbbf24">Pre-commit hook latency: 1.8 ms</text>
  </g>
</svg>
