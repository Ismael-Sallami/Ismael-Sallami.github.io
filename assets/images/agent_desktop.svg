<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <title>agent-desktop-linux-cursor (adc): Escritorio Linux aislado en Xephyr con motor AT-SPI y cursor de agente visible</title>
  <rect width="1400" height="560" fill="#0a0d16"/>
  <g stroke="#1b2436" stroke-width="1" opacity="0.55">
    <line x1="50" y1="0" x2="50" y2="560"/><line x1="150" y1="0" x2="150" y2="560"/>
    <line x1="250" y1="0" x2="250" y2="560"/><line x1="350" y1="0" x2="350" y2="560"/>
    <line x1="450" y1="0" x2="450" y2="560"/><line x1="550" y1="0" x2="550" y2="560"/>
    <line x1="650" y1="0" x2="650" y2="560"/><line x1="750" y1="0" x2="750" y2="560"/>
    <line x1="850" y1="0" x2="850" y2="560"/><line x1="950" y1="0" x2="950" y2="560"/>
    <line x1="1050" y1="0" x2="1050" y2="560"/><line x1="1150" y1="0" x2="1150" y2="560"/>
    <line x1="1250" y1="0" x2="1250" y2="560"/><line x1="1350" y1="0" x2="1350" y2="560"/>
    <line x1="0" y1="50" x2="1400" y2="50"/><line x1="0" y1="150" x2="1400" y2="150"/>
    <line x1="0" y1="250" x2="1400" y2="250"/><line x1="0" y1="350" x2="1400" y2="350"/>
    <line x1="0" y1="450" x2="1400" y2="450"/><line x1="0" y1="550" x2="1400" y2="550"/>
  </g>

  <!-- Panel Izquierdo: Motor de Accesibilidad AT-SPI + CLI adc -->
  <rect x="85" y="95" width="430" height="370" rx="12" fill="#0d1220" stroke="#10b981" stroke-width="2.5"/>
  <rect x="85" y="95" width="430" height="42" rx="12" fill="#0d231d"/>
  <circle cx="115" cy="116" r="5" fill="#10b981"/>
  <text x="135" y="121" font-family="monospace" font-size="15" font-weight="bold" fill="#34d399">adc snapshot --app chrome -i</text>

  <!-- Árbol AT-SPI con referencias @ref -->
  <g font-family="monospace" font-size="14">
    <text x="115" y="172" fill="#94a3b8">[frame] "Chromium · Agent Profile"</text>
    <text x="135" y="204" fill="#34d399">├─ button "Sign In" @3fa1:e08</text>
    <text x="135" y="236" fill="#38bdf8">├─ entry "Search jobs..." @3fa1:e12</text>
    <text x="135" y="268" fill="#a78bfa">├─ combo "Location: Remote" @3fa1:e19</text>
    <text x="135" y="300" fill="#fbbf24">└─ button "Apply Now" @3fa1:e24</text>
  </g>

  <!-- Bloque de ejecución CLI -->
  <rect x="110" y="330" width="380" height="108" rx="8" fill="#070a10" stroke="#1e293b" stroke-width="1.5"/>
  <g font-family="monospace" font-size="13.5">
    <text x="128" y="358" fill="#10b981">$ adc click @3fa1:e24 --label "Apply"</text>
    <text x="128" y="384" fill="#38bdf8">$ adc see --region 600,130,1000,260</text>
    <text x="128" y="410" fill="#f43f5e">$ adc ask-user "Complete 2FA step"</text>
  </g>

  <!-- Conector de bus privado D-Bus + Xephyr :99 -->
  <path d="M515 280 L615 280" stroke="#10b981" stroke-width="3" stroke-dasharray="7,5"/>
  <rect x="530" y="242" width="70" height="26" rx="5" fill="#0d231d" stroke="#10b981" stroke-width="1.5"/>
  <text x="545" y="260" font-family="monospace" font-size="14" font-weight="bold" fill="#34d399">:99</text>

  <!-- Panel Derecho: Escritorio Xephyr Aislado con Cursor de Agente y Rejilla de Visión -->
  <rect x="615" y="75" width="700" height="410" rx="14" fill="#0d1220" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="615" y="75" width="700" height="44" rx="14" fill="#111d2f"/>
  <circle cx="645" cy="97" r="5.5" fill="#f43f5e"/>
  <circle cx="665" cy="97" r="5.5" fill="#fbbf24"/>
  <circle cx="685" cy="97" r="5.5" fill="#10b981"/>
  <text x="712" y="102" font-family="monospace" font-size="14" font-weight="bold" fill="#7dd3fc">Xephyr :99 · Isolated GNOME Workspace · REC ●</text>

  <!-- Rejilla de coordenadas adc see -->
  <g stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3,5" opacity="0.25">
    <line x1="755" y1="119" x2="755" y2="485"/>
    <line x1="895" y1="119" x2="895" y2="485"/>
    <line x1="1035" y1="119" x2="1035" y2="485"/>
    <line x1="1175" y1="119" x2="1175" y2="485"/>
    <line x1="615" y1="210" x2="1315" y2="210"/>
    <line x1="615" y1="305" x2="1315" y2="305"/>
    <line x1="615" y1="400" x2="1315" y2="400"/>
  </g>

  <!-- Ventana de aplicación dentro del Xephyr privado -->
  <rect x="655" y="145" width="620" height="305" rx="10" fill="#131b2e" stroke="#334155" stroke-width="2"/>
  <rect x="685" y="175" width="240" height="16" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="685" y="205" width="380" height="10" rx="3" fill="#64748b" opacity="0.5"/>
  <rect x="685" y="225" width="320" height="10" rx="3" fill="#64748b" opacity="0.4"/>

  <!-- Campo de formulario activo con foco AT-SPI -->
  <rect x="685" y="260" width="350" height="42" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
  <text x="702" y="286" font-family="monospace" font-size="14" fill="#e2e8f0">Senior Systems Engineer</text>
  <line x1="905" y1="270" x2="905" y2="292" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Botón objetivo resaltado por el motor de accesibilidad (@3fa1:e24) -->
  <rect x="685" y="330" width="190" height="48" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="728" y="360" font-family="monospace" font-size="16" font-weight="bold" fill="#34d399">Apply Now</text>

  <!-- Ondas de clic y Cursor visible del Agente con etiqueta de intención -->
  <circle cx="845" cy="358" r="28" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.65"/>
  <circle cx="845" cy="358" r="14" fill="#f43f5e" fill-opacity="0.25" stroke="#f43f5e" stroke-width="2"/>
  <polygon points="845,358 845,392 856,383 866,400 873,396 863,379 877,379" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Etiqueta flotante del cursor del agente -->
  <rect x="882" y="366" width="235" height="34" rx="6" fill="#f43f5e"/>
  <text x="896" y="388" font-family="monospace" font-size="13.5" font-weight="bold" fill="#ffffff">adc · Click @3fa1:e24</text>
</svg>
