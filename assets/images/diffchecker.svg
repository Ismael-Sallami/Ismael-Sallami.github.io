<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <title>Diffchecker: Comparador de texto y fusión por bloques en navegador sin dependencias</title>
  <rect width="1400" height="560" fill="#0a0d16"/>
  <g stroke="#1b2436" stroke-width="1" opacity="0.55">
    <line x1="50" y1="0" x2="50" y2="560"/><line x1="150" y1="0" x2="150" y2="560"/>
    <line x1="250" y1="0" x2="250" y2="560"/><line x1="350" y1="0" x2="350" y2="560"/>
    <line x1="450" y1="0" x2="450" y2="560"/><line x1="550" y1="0" x2="550" y2="560"/>
    <line x1="650" y1="0" x2="650" y2="560"/><line x1="750" y1="0" x2="750" y2="560"/>
    <line x1="850" y1="0" x2="850" y2="560"/><line x1="950" y1="0" x2="950" y2="560"/>
    <line x1="1050" y1="0" x2="1050" y2="560"/><line x1="1150" y1="0" x2="1150" y2="560"/>
    <line x1="1250" y1="0" x2="1250" y2="560"/><line x1="1350" y1="0" x2="1350" y2="560"/>
    <line x1="0" y1="50" x2="1400" y2="50"/><line x1="0" y1="150" x2="1400" y2="150"/>
    <line x1="0" y1="250" x2="1400" y2="250"/><line x1="0" y1="350" x2="1400" y2="350"/>
    <line x1="0" y1="450" x2="1400" y2="450"/><line x1="0" y1="550" x2="1400" y2="550"/>
  </g>

  <!-- Panel Izquierdo: Archivo Original A (Rojo / Eliminado) -->
  <rect x="120" y="90" width="480" height="380" rx="10" fill="#0d1220" stroke="#f43f5e" stroke-width="2"/>
  <rect x="120" y="90" width="480" height="42" rx="10" fill="#1e131d"/>
  <circle cx="150" cy="111" r="5" fill="#f43f5e"/>
  <rect x="170" y="105" width="120" height="12" rx="3" fill="#f43f5e" opacity="0.8"/>

  <!-- Líneas de código A -->
  <g fill="#94a3b8" opacity="0.4">
    <rect x="150" y="160" width="280" height="10" rx="3"/>
    <rect x="150" y="185" width="210" height="10" rx="3"/>
  </g>
  <!-- Bloque rojo modificado/borrado -->
  <rect x="135" y="215" width="450" height="65" rx="6" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1.5"/>
  <g fill="#f43f5e" opacity="0.9">
    <text x="145" y="240" font-family="monospace" font-size="16" font-weight="bold">-</text>
    <rect x="165" y="230" width="260" height="10" rx="3"/>
    <text x="145" y="265" font-family="monospace" font-size="16" font-weight="bold">-</text>
    <rect x="165" y="255" width="310" height="10" rx="3"/>
  </g>
  <g fill="#94a3b8" opacity="0.4">
    <rect x="150" y="305" width="340" height="10" rx="3"/>
    <rect x="150" y="330" width="190" height="10" rx="3"/>
    <rect x="150" y="355" width="240" height="10" rx="3"/>
    <rect x="150" y="380" width="160" height="10" rx="3"/>
    <rect x="150" y="405" width="290" height="10" rx="3"/>
  </g>

  <!-- Centro: Algoritmo Myers de caminos y botones de fusión -->
  <g fill="#0ea5e9" stroke="#0ea5e9">
    <circle cx="700" cy="245" r="22" fill="#0d1b2a" stroke-width="2.5"/>
    <path d="M692 245 L708 245 M702 239 L708 245 L702 251" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="700" cy="330" r="18" fill="#0d1b2a" stroke-width="2"/>
    <path d="M708 330 L692 330 M698 324 L692 330 L698 336" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Panel Derecho: Archivo Modificado B (Verde / Añadido) -->
  <rect x="800" y="90" width="480" height="380" rx="10" fill="#0d1220" stroke="#10b981" stroke-width="2"/>
  <rect x="800" y="90" width="480" height="42" rx="10" fill="#0d1f1b"/>
  <circle cx="830" cy="111" r="5" fill="#10b981"/>
  <rect x="850" y="105" width="130" height="12" rx="3" fill="#10b981" opacity="0.8"/>

  <!-- Líneas de código B -->
  <g fill="#94a3b8" opacity="0.4">
    <rect x="830" y="160" width="280" height="10" rx="3"/>
    <rect x="830" y="185" width="210" height="10" rx="3"/>
  </g>
  <!-- Bloque verde añadido -->
  <rect x="815" y="215" width="450" height="90" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <g fill="#10b981" opacity="0.9">
    <text x="825" y="240" font-family="monospace" font-size="16" font-weight="bold">+</text>
    <rect x="845" y="230" width="290" height="10" rx="3"/>
    <text x="825" y="265" font-family="monospace" font-size="16" font-weight="bold">+</text>
    <rect x="845" y="255" width="340" height="10" rx="3"/>
    <text x="825" y="290" font-family="monospace" font-size="16" font-weight="bold">+</text>
    <rect x="845" y="280" width="210" height="10" rx="3"/>
  </g>
  <g fill="#94a3b8" opacity="0.4">
    <rect x="830" y="330" width="340" height="10" rx="3"/>
    <rect x="830" y="355" width="240" height="10" rx="3"/>
    <rect x="830" y="380" width="160" height="10" rx="3"/>
    <rect x="830" y="405" width="290" height="10" rx="3"/>
  </g>
</svg>
