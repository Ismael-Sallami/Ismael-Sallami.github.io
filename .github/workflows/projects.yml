# Refreshes the project cards and their READMEs from the GitHub API.
#
# GitHub has no event for "a repository was created" that can reach a workflow in
# another repository of a personal account, so this runs on a timer instead. Give a new
# repository the `portfolio` topic and it appears here on the next run; the manual
# trigger is there for when that wait is too long.
#
# The commit this pushes lands on main, which triggers the deploy workflow, so the site
# picks the new projects up on its own. Nothing is committed when nothing changed.
name: Sync projects

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm ci: the script runs on Node's own fetch and nothing else.
      - run: node scripts/sync-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: commit
        name: Commit if anything moved
        run: |
          git config user.name  "Ismael"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          # Staged first, then compared against the index: the README of a repository
          # that has only just been given the topic is a new file, and `git diff` on its
          # own does not see one.
          # These files are generated whole on every run, so there is never anything to
          # merge: the version just produced is the correct one by definition. Rebasing one
          # against a main that moved could only ever produce a conflict, and did.
          #
          # Moving HEAD to origin/main and staging the generated paths from the working
          # tree gives a commit that applies cleanly whatever else landed meanwhile.
          git fetch origin main
          git reset --mixed origin/main
          git add -A src/data/projects.generated.json src/data/readmes
          if git diff --cached --quiet; then
            echo "No change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: refresh the project READMEs from GitHub"
          git push

      # A push made with the default GITHUB_TOKEN does not start another workflow. That is
      # deliberate on GitHub's part, to stop workflows triggering each other in a loop, and
      # it means the `on: push` in deploy.yml never saw any of these commits: the data
      # reached the site only when some unrelated push happened to redeploy it.
      #
      # workflow_dispatch is the documented exception, so the deploy is asked for by name.
      - name: Deploy the change
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml
