# Refreshes the home timeline from the Google Sheet the roles are written in.
#
# GitHub cannot be told "a row changed", so this runs on a timer. Add a role in the
# morning and it is on the site by the next run at the latest; the manual trigger is
# there for when that wait is too long.
#
# The commit this pushes lands on main, which triggers the deploy workflow, so the site
# picks the new roles up on its own. Nothing is committed when nothing changed.
name: Sync experience

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-experience
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm ci: the script runs on Node's own fetch and nothing else.
      - run: node scripts/sync-experience.mjs

      - id: commit
        name: Commit if anything moved
        run: |
          git config user.name  "Ismael"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          # These files are generated whole on every run, so there is never anything to
          # merge: the version just produced is the correct one by definition. Rebasing one
          # against a main that moved could only ever produce a conflict, and did.
          #
          # Moving HEAD to origin/main and staging the generated paths from the working
          # tree gives a commit that applies cleanly whatever else landed meanwhile.
          git fetch origin main
          git reset --mixed origin/main
          # Staged first, then compared against the index, so a file that did not exist
          # before is still seen: `git diff` alone does not report an untracked file.
          git add -A src/data/experience.generated.json
          if git diff --cached --quiet; then
            echo "No change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: refresh the experience timeline from the sheet"
          git push

      # A push made with the default GITHUB_TOKEN does not start another workflow. That is
      # deliberate on GitHub's part, to stop workflows triggering each other in a loop, and
      # it means the `on: push` in deploy.yml never saw any of these commits: the data
      # reached the site only when some unrelated push happened to redeploy it.
      #
      # workflow_dispatch is the documented exception, so the deploy is asked for by name.
      - name: Deploy the change
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml
